<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon-pricing-tool.png">
    <title>Consulta Precios Actualizados de Combustibles en el Perú</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        

    </style>
</head>
<body>
    <div class="main-wrapper">
        <h1 class="center-text margin-bottom-4 title">Precio del combustible en Perú</h1>
        <h3 class="center-text margin-bottom-4 subtitle">Actualizado Hoy Miércoles, 26 de marzo del 2025</h3>
        
        <div class="content-panel">
            <div class="panel-header">
                <i class="bi bi-funnel-fill me-2"></i>Filtros
            </div>
            <div class="filter-section">
                <div class="row g-3">
                    <div class="custom-col">
                        <label for="tipoEstablecimiento" class="input-label">Tipo de Establecimiento:</label>
                        <select id="tipoEstablecimiento" class="custom-dropdown">
                            <option value="">Todos</option>
                            <!-- Se llenará dinámicamente -->
                        </select>
                    </div>
                    <div class="custom-col">
                        <label for="departamento" class="input-label">Departamento:</label>
                        <select id="departamento" class="custom-dropdown">
                            <option value="">Todos</option>
                            <!-- Se llenará dinámicamente -->
                        </select>
                    </div>
                    <div class="custom-col">
                        <label for="provincia" class="input-label">Provincia:</label>
                        <select id="provincia" class="custom-dropdown">
                            <option value="">Todas</option>
                            <!-- Se llenará dinámicamente -->
                        </select>
                    </div>
                    <div class="custom-col">
                        <label for="distrito" class="input-label">Distrito:</label>
                        <select id="distrito" class="custom-dropdown">
                            <option value="">Todos</option>
                            <!-- Se llenará dinámicamente -->
                        </select>
                    </div>
                    <div class="custom-col">
                        <label for="producto" class="input-label">Producto:</label>
                        <select id="producto" class="custom-dropdown">
                            <option value="">Todos</option>
                            <!-- Se llenará dinámicamente -->
                        </select>
                    </div>
                    <div class="custom-col flex-end">
                        <div class="button-grid">
                            <button id="btnDownload" class="btn btnDownload me-md-2">
                                <i class="bi bi-download me-1"></i>Descargar Excel
                            </button>
                            <button id="btnClear" class="btn btn-clear me-md-2">
                                <i class="bi bi-x-circle me-1"></i>Limpiar
                            </button>
                            <button id="btnFilter" class="btn btn-filter">
                                <i class="bi bi-search me-1"></i>Filtrar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-panel">
            <div class="panel-header">
                <i class="bi bi-table me-2"></i>Resultados
            </div>
            <div class="info-paginado espaciado-3 contenedor-flex espacio-entre alinear-centro">
                <div>
                    <span id="totalRegistros">0</span> registros encontrados
                </div>
                <div class="flex-display items-center">
                    <label for="itemsPerPage" class="me-2">Mostrar:</label>
                    <select id="itemsPerPage" class="custom-dropdown custom-dropdown-sm" style="width: auto;">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
            <div class="data-grid-container">
                <table class="data-grid">
                    <thead>
                        <tr>
                            <th>RUC</th>
                            <th>Razón Social</th>
                            <th>Departamento</th>
                            <th>Provincia</th>
                            <th>Distrito</th>
                            <th>Dirección</th>
                            <th>Producto</th>
                            <th>Unidad</th>
                            <th id="priceHeader" onclick="sortTableByPrice()" style="cursor: pointer;">Precio</th>
                            <th>Fecha Registro</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                    </tbody>
                        <!-- Se llenará dinámicamente -->
                    </tbody>
                </table>
            </div>
            <div class="flex-container center-content padding-medium">
                <nav aria-label="Paginación de resultados">
                    <ul class="page-navigator" id="pagination">
                        <!-- Se llenará dinámicamente -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>



    
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script>

        // Función para formatear la fecha en español
        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('es-ES', options);
        }

        // Actualizar el subtítulo con la fecha actual
        function updateSubtitle() {
            const subtitle = document.querySelector('.subtitle');
            const currentDate = new Date();
            subtitle.textContent = `Actualizado Hoy ${formatDate(currentDate)}`;
        }

        // Llamar a la función cuando se cargue la página
        document.addEventListener('DOMContentLoaded', () => {
            updateSubtitle();
            loadData();
        });


        // Variables globales
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        let itemsPerPage = 10;
        let departamentos = [];
        let provincias = [];
        let distritos = [];
        let productos = [];
        let tiposEstablecimiento = [];

        // Elementos DOM
        const loadingOverlay = document.getElementById('loadingOverlay');
        const dataTable = document.getElementById('dataTable');
        const totalRegistros = document.getElementById('totalRegistros');
        const pagination = document.getElementById('pagination');
        const itemsPerPageSelect = document.getElementById('itemsPerPage');
        
        // Selectores de filtros
        const tipoEstablecimientoSelect = document.getElementById('tipoEstablecimiento');
        const departamentoSelect = document.getElementById('departamento');
        const provinciaSelect = document.getElementById('provincia');
        const distritoSelect = document.getElementById('distrito');
        const productoSelect = document.getElementById('producto');
        
        // Botones
        const btnFilter = document.getElementById('btnFilter');
        const btnClear = document.getElementById('btnClear');

        // Botón de descarga Excel
        const btnDownload = document.getElementById('btnDownload');
        btnDownload.addEventListener('click', () => {
            // Preparar los datos para Excel
            const headers = ['RUC', 'Razón Social', 'Departamento', 'Provincia', 'Distrito', 'Dirección', 'Producto', 'Unidad', 'Precio', 'Fecha Registro'];
            const exportData = [headers];

            // Agregar datos
            filteredData.forEach(item => {
                exportData.push([
                    item.RUC || '-',
                    item.RAZON || '-',
                    item.DEPARTAMENTO || '-',
                    item.PROVINCIA || '-',
                    item.DISTRITO || '-',
                    item.DIRECCION || '-',
                    item.PRODUCTO || '-',
                    item.UNIDAD || '-',
                    item.PRECIO_VENTA ? `S/ ${parseFloat(item.PRECIO_VENTA).toFixed(2)}` : '-',
                    item.FCHA_REGISTRO || '-'
                ]);
            });

            // Generar nombre de archivo dinámico basado en los filtros
            const filterParts = [];
            if (tipoEstablecimientoSelect.value) filterParts.push(`establecimiento_${tipoEstablecimientoSelect.value}`);
            if (departamentoSelect.value) filterParts.push(`depto_${departamentoSelect.value}`);
            if (provinciaSelect.value) filterParts.push(`prov_${provinciaSelect.value}`);
            if (distritoSelect.value) filterParts.push(`dist_${distritoSelect.value}`);
            if (productoSelect.value) filterParts.push(`prod_${productoSelect.value}`);
            
            const currentDate = new Date().toISOString().split('T')[0];
            const currentTime = new Date().toLocaleTimeString('es-PE', { hour12: false }).replace(/:/g, '-');
            const fileName = filterParts.length > 0
                ? `reporte_combustibles_${filterParts.join('_')}_${currentDate}_${currentTime}.xlsx`
                : `reporte_combustibles_${currentDate}_${currentTime}.xlsx`;
            
            // Crear el archivo Excel usando SheetJS
            const ws = XLSX.utils.aoa_to_sheet(exportData);
            
            // Ajustar el ancho de las columnas
            const colWidths = [
                { wch: 15 },  // RUC
                { wch: 40 },  // Razón Social
                { wch: 20 },  // Departamento
                { wch: 20 },  // Provincia
                { wch: 20 },  // Distrito
                { wch: 40 },  // Dirección
                { wch: 30 },  // Producto
                { wch: 10 },  // Unidad
                { wch: 10 },  // Precio
                { wch: 20 }   // Fecha Registro
            ];
            ws['!cols'] = colWidths;

            // Aplicar estilos a las celdas
            const headerStyle = {
                font: { bold: true, color: { rgb: "FFFFFF" } },
                fill: { fgColor: { rgb: "4F81BD" } },
                alignment: { horizontal: "center", vertical: "center" }
            };

            const dataStyle = {
                alignment: { horizontal: "left", vertical: "center" },
                font: { color: { rgb: "000000" } }
            };

            // Aplicar estilos al encabezado
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let C = range.s.c; C <= range.e.c; ++C) {
                const address = XLSX.utils.encode_cell({ r: 0, c: C });
                if (!ws[address]) continue;
                ws[address].s = headerStyle;
            }

            // Aplicar estilos a los datos
            for (let R = 1; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const address = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[address]) continue;
                    ws[address].s = dataStyle;
                }
            }
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Precios Combustibles");
            
            // Descargar el archivo Excel
            XLSX.writeFile(wb, fileName);
        });
        
        // Función para mostrar el estado de carga en la interfaz
        function updateLoadingState(isLoading) {
            const tableBody = document.getElementById('dataTable');
            if (isLoading) {
                tableBody.innerHTML = '<tr><td colspan="10" class="text-center">Cargando datos...</td></tr>';
            }
        }

        // Función para cargar los datos de filtros
        async function loadFilters() {
            try {
                const response = await fetch('data/filters.json');
                if (!response.ok) {
                    throw new Error('Error al cargar los filtros');
                }
                filtersData = await response.json();
                populateFilterSelects();
            } catch (error) {
                console.error('Error cargando filtros:', error);
            }
        }

        // Función para cargar los datos iniciales
        async function loadData() {
            try {
                updateLoadingState(true);
                console.log('Iniciando carga de datos...');
                //cambiar url local: "http://localhost:3000/precios" / url hosting: "/app-precios/precios"
                const response = await fetch('http://localhost:3000/precios'); 
                console.log('Respuesta recibida:', response.status);
                if (!response.ok) {
                    throw new Error('Error al cargar los datos');
                }
                const data = await response.json();
                console.log('Datos recibidos:', data);
                allData = data.data;
                filteredData = [...allData];
                
                // Extraer y almacenar valores únicos para los tipos de establecimiento
                tiposEstablecimiento = [...new Set(allData.map(item => item.RAZON_SOCIAL).filter(Boolean))].sort();
                
                // Extraer valores únicos para provincias y distritos (se usarán en los eventos change)
                provincias = [...new Set(allData.map(item => item.PROVINCIA).filter(Boolean))].sort();
                distritos = [...new Set(allData.map(item => item.DISTRITO).filter(Boolean))].sort();
                
                // Llenar los selectores de filtros
                populateFilterSelects();
                
                // Mostrar los datos
                updateTable();
            } catch (error) {
                console.error('Error:', error);
                const tableBody = document.getElementById('dataTable');
                tableBody.innerHTML = '<tr><td colspan="10" class="text-center text-danger">Error al cargar los datos. Por favor, intente nuevamente.</td></tr>';
            } finally {
                updateLoadingState(false);
            }
        }

        // Función para extraer valores únicos para los filtros
        function extractFilterValues() {
            tiposEstablecimiento = [...new Set(allData.map(item => item.RAZON_SOCIAL).filter(Boolean))];
            departamentos = [...new Set(allData.map(item => item.DEPARTAMENTO).filter(Boolean))];
            provincias = [...new Set(allData.map(item => item.PROVINCIA).filter(Boolean))];
            distritos = [...new Set(allData.map(item => item.DISTRITO).filter(Boolean))];
            productos = [...new Set(allData.map(item => item.PRODUCTO).filter(Boolean))];
            
            // Ordenar alfabéticamente
            tiposEstablecimiento.sort();
            departamentos.sort();
            provincias.sort();
            distritos.sort();
            productos.sort();
        }

        // Función para llenar los selectores de filtros
        async function populateFilterSelects() {
            try {
                // Cargar datos de filters.json
                const response = await fetch('data/filters.json');
                if (!response.ok) {
                    throw new Error('Error al cargar los filtros');
                }
                const filtersData = await response.json();

                // Limpiar selectores antes de llenarlos
                tipoEstablecimientoSelect.innerHTML = '<option value="">Todos</option>';
                departamentoSelect.innerHTML = '<option value="">Todos</option>';
                productoSelect.innerHTML = '<option value="">Todos</option>';
                
                // Llenar selector de tipo de establecimiento desde los datos del servidor
                tiposEstablecimiento.forEach(razon => {
                    const option = document.createElement('option');
                    option.value = razon;
                    option.textContent = razon;
                    tipoEstablecimientoSelect.appendChild(option);
                });
                
                // Llenar selector de departamento desde filters.json
                filtersData.Departamento.forEach(depto => {
                    const option = document.createElement('option');
                    option.value = depto;
                    option.textContent = depto;
                    departamentoSelect.appendChild(option);
                });
                
                // Llenar selector de producto desde filters.json
                filtersData.Producto.forEach(prod => {
                    const option = document.createElement('option');
                    option.value = prod;
                    option.textContent = prod;
                    productoSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar los filtros:', error);
            }

            
            // Llenar selector de provincia basado en departamento seleccionado
            departamentoSelect.addEventListener('change', function() {
                const selectedDepto = this.value;
                provinciaSelect.innerHTML = '<option value="">Seleccione provincia</option>';
                distritoSelect.innerHTML = '<option value="">Seleccione distrito</option>';
                
                if (selectedDepto) {
                    // Filtrar provincias del departamento seleccionado desde los datos del servidor
                    const provinciasDelDepartamento = [...new Set(allData
                        .filter(item => item.DEPARTAMENTO === selectedDepto)
                        .map(item => item.PROVINCIA)
                        .filter(Boolean))].sort();
                    
                    provinciasDelDepartamento.forEach(prov => {
                        const option = document.createElement('option');
                        option.value = prov;
                        option.textContent = prov;
                        provinciaSelect.appendChild(option);
                    });
                }
            });
            
            // Llenar selector de distrito basado en provincia seleccionada
            provinciaSelect.addEventListener('change', function() {
                const selectedProv = this.value;
                distritoSelect.innerHTML = '<option value="">Seleccione distrito</option>';
                
                if (selectedProv) {
                    // Filtrar distritos de la provincia seleccionada desde los datos del servidor
                    const distritosDelaProvincia = [...new Set(allData
                        .filter(item => item.PROVINCIA === selectedProv)
                        .map(item => item.DISTRITO)
                        .filter(Boolean))].sort();
                    
                    distritosDelaProvincia.forEach(dist => {
                        const option = document.createElement('option');
                        option.value = dist;
                        option.textContent = dist;
                        distritoSelect.appendChild(option);
                    });
                }
            });
        }

        // Función para actualizar la tabla con los datos filtrados
        function updateTable() {
            // Calcular índices para paginación
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);
            
            // Actualizar contador de registros
            totalRegistros.textContent = filteredData.length;
            
            // Limpiar tabla
            dataTable.innerHTML = '';
            
            // Si no hay datos, mostrar mensaje
            if (paginatedData.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 5;
                cell.textContent = 'No se encontraron registros';
                cell.className = 'text-center py-3';
                row.appendChild(cell);
                dataTable.appendChild(row);
                
                // Ocultar paginación
                pagination.innerHTML = '';
                return;
            }
            
            // Llenar tabla con datos
            paginatedData.forEach(item => {
                const row = document.createElement('tr');
                    
                    // RUC
                    const rucCell = document.createElement('td');
                    rucCell.textContent = item.RUC || '-';
                    row.appendChild(rucCell);
                    
                    // Razón Social
                    const razonSocialCell = document.createElement('td');
                    razonSocialCell.textContent = item.RAZON_SOCIAL || '-';
                    row.appendChild(razonSocialCell);
                
                // Departamento
                const departamentoCell = document.createElement('td');
                departamentoCell.textContent = item.DEPARTAMENTO || '-';
                row.appendChild(departamentoCell);
            
                // Provincia
                const provinciaCell = document.createElement('td');
                provinciaCell.textContent = item.PROVINCIA || '-';
                row.appendChild(provinciaCell);
                
                // Distrito
                const distritoCell = document.createElement('td');
                distritoCell.textContent = item.DISTRITO || '-';
                row.appendChild(distritoCell);
                    
                // Dirección
                const direccionCell = document.createElement('td');
                direccionCell.textContent = item.DIRECCION || '-';
                row.appendChild(direccionCell);
                    
                // Producto
                const productoCell = document.createElement('td');
                productoCell.textContent = item.PRODUCTO || '-';
                row.appendChild(productoCell);
                    
                // Unidad
                const unidadCell = document.createElement('td');
                unidadCell.textContent = item.UNIDAD || '-';
                row.appendChild(unidadCell);
                    
                // Precio
                const precioCell = document.createElement('td');
                precioCell.textContent = item.PRECIO ? `S/ ${parseFloat(item.PRECIO).toFixed(2)}` : '-';
                row.appendChild(precioCell);
                    
                // Fecha Registro
                const fechaRegistroCell = document.createElement('td');
                const fecha = item.FCHA_REGISTRO ? new Date(item.FCHA_REGISTRO).toLocaleDateString() : '-';
                fechaRegistroCell.textContent = fecha;
                row.appendChild(fechaRegistroCell);
                
                dataTable.appendChild(row);
            });
            
            // Actualizar paginación
            updatePagination();
        }

        // Función para ordenar la tabla por precio
let priceSortOrder = 'desc';
const priceHeader = document.getElementById('priceHeader');
priceHeader.addEventListener('click', () => {
    const existingIcon = priceHeader.querySelector('i');
    if (existingIcon) {
        existingIcon.innerHTML = priceSortOrder === 'asc' ? '&darr;' : '&uarr;';
    } else {
        const sortIcon = document.createElement('i');
        sortIcon.innerHTML = priceSortOrder === 'asc' ? '&darr;' : '&uarr;';
        priceHeader.appendChild(sortIcon);
    }
});

function sortTableByPrice() {
    let sortIcon = priceHeader.querySelector('i');
    if (!sortIcon) {
        sortIcon = document.createElement('i');
        priceHeader.appendChild(sortIcon);
    }
    
    priceSortOrder = priceSortOrder === 'asc' ? 'desc' : 'asc';
    sortIcon.innerHTML = priceSortOrder === 'asc' ? '↑' : '↓';
    
    filteredData.sort((a, b) => {
        const priceA = parseFloat(a.PRECIO || 0);
        const priceB = parseFloat(b.PRECIO || 0);
        if (isNaN(priceA) || isNaN(priceB)) return 0;
        return priceSortOrder === 'asc' ? priceA - priceB : priceB - priceA;
    });
    updateTable();
}

// Función para actualizar la paginación
        function updatePagination() {
            pagination.innerHTML = '';
            
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (totalPages <= 1) {
                return;
            }
            
            // Botón Anterior
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            const prevLink = document.createElement('a');
            prevLink.className = 'page-link';
            prevLink.href = '#';
            prevLink.setAttribute('aria-label', 'Anterior');
            prevLink.innerHTML = '<span aria-hidden="true">&laquo;</span>';
            prevLink.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    updateTable();
                }
            });
            prevLi.appendChild(prevLink);
            pagination.appendChild(prevLi);
            
            // Determinar qué páginas mostrar
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            
            // Ajustar si estamos cerca del final
            if (endPage - startPage < 4) {
                startPage = Math.max(1, endPage - 4);
            }
            
            // Botones de página
            for (let i = startPage; i <= endPage; i++) {
                const pageLi = document.createElement('li');
                pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
                const pageLink = document.createElement('a');
                pageLink.className = 'page-link';
                pageLink.href = '#';
                pageLink.textContent = i;
                pageLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = i;
                    updateTable();
                });
                pageLi.appendChild(pageLink);
                pagination.appendChild(pageLi);
            }
            
            // Botón Siguiente
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
            const nextLink = document.createElement('a');
            nextLink.className = 'page-link';
            nextLink.href = '#';
            nextLink.setAttribute('aria-label', 'Siguiente');
            nextLink.innerHTML = '<span aria-hidden="true">&raquo;</span>';
            nextLink.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage < totalPages) {
                    currentPage++;
                    updateTable();
                }
            });
            nextLi.appendChild(nextLink);
            pagination.appendChild(nextLi);
        }

        // Función para aplicar filtros
        function applyFilters() {
            // Reiniciar el ícono de ordenamiento
            const sortIcon = priceHeader.querySelector('i');
            if (sortIcon) {
                sortIcon.style.display = 'inline';
                sortIcon.className = priceSortOrder === 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down';
            }

            const tipoEstablecimiento = tipoEstablecimientoSelect.value;
            const departamento = departamentoSelect.value;
            const provincia = provinciaSelect.value;
            const distrito = distritoSelect.value;
            const producto = productoSelect.value;
            
            filteredData = allData.filter(item => {
                // Check if the item has all required properties before comparison
                const matchTipo = !tipoEstablecimiento || (item.RAZON_SOCIAL && item.RAZON_SOCIAL.trim() === tipoEstablecimiento.trim());
                const matchDepartamento = !departamento || (item.DEPARTAMENTO && item.DEPARTAMENTO.trim() === departamento.trim());
                const matchProvincia = !provincia || (item.PROVINCIA && item.PROVINCIA.trim() === provincia.trim());
                const matchDistrito = !distrito || (item.DISTRITO && item.DISTRITO.trim() === distrito.trim());
                const matchProducto = !producto || (item.PRODUCTO && item.PRODUCTO.trim() === producto.trim());
                
                return matchTipo && matchDepartamento && matchProvincia && matchDistrito && matchProducto;
            });
            
            // Resetear a la primera página
            currentPage = 1;
            updateTable();
        }

        // Función para limpiar filtros
        function clearFilters() {
            tipoEstablecimientoSelect.value = '';
            departamentoSelect.value = '';
            provinciaSelect.value = '';
            distritoSelect.value = '';
            productoSelect.value = '';
            
            // Ocultar el ícono de ordenamiento
            const sortIcon = priceHeader.querySelector('i');
            if (sortIcon) {
                sortIcon.style.display = 'none';
            }
            
            filteredData = [...allData];
            currentPage = 1;
            updateTable();
        }

        // Función para actualizar provincias basado en departamento seleccionado
        function updateProvincias() {
            const departamento = departamentoSelect.value;
            
            // Limpiar y reiniciar selector de provincia
            provinciaSelect.innerHTML = '<option value="">Todas</option>';
            distritoSelect.innerHTML = '<option value="">Todos</option>';
            
            if (departamento && filtersData.provincias[departamento]) {
                // Usar provincias precargadas del JSON
                filtersData.provincias[departamento].forEach(prov => {
                    const option = document.createElement('option');
                    option.value = prov;
                    option.textContent = prov;
                    provinciaSelect.appendChild(option);
                });
            }
            
            // Actualizar distritos
            updateDistritos();
        }

        // Función para actualizar distritos basado en provincia seleccionada
        function updateDistritos() {
            const departamento = departamentoSelect.value;
            const provincia = provinciaSelect.value;
            
            // Limpiar y reiniciar selector de distrito
            distritoSelect.innerHTML = '<option value="">Todos</option>';
            
            let filteredDistritos = [];
            
            if (provincia) {
                // Usar distritos precargados del JSON si existen
                if (filtersData.distritos && filtersData.distritos[provincia]) {
                    filteredDistritos = filtersData.distritos[provincia];
                } else {
                    // Filtrar distritos por provincia seleccionada
                    filteredDistritos = [...new Set(
                        allData
                            .filter(item => item.PROVINCIA === provincia)
                            .map(item => item.DISTRITO)
                            .filter(Boolean)
                    )];
                }
            } else if (departamento) {
                // Filtrar distritos por departamento seleccionado
                filteredDistritos = [...new Set(
                    allData
                        .filter(item => item.DEPARTAMENTO === departamento)
                        .map(item => item.DISTRITO)
                        .filter(Boolean)
                )];
            } else {
                // Si no hay filtros, mostrar todos los distritos
                filteredDistritos = [...distritos];
            }
            
            filteredDistritos.sort();
            
            filteredDistritos.forEach(dist => {
                const option = document.createElement('option');
                option.value = dist;
                option.textContent = dist;
                distritoSelect.appendChild(option);
            });
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar filtros primero
            loadFilters();
            // Cargar datos iniciales
            loadData();
            
            // Evento para el botón de filtrar
            btnFilter.addEventListener('click', applyFilters);
            
            // Evento para el botón de limpiar
            btnClear.addEventListener('click', clearFilters);
            
            // Evento para cambiar items por página
            itemsPerPageSelect.addEventListener('change', () => {
                itemsPerPage = parseInt(itemsPerPageSelect.value);
                currentPage = 1;
                updateTable();
            });
            
            // Eventos para actualizar filtros dependientes
            departamentoSelect.addEventListener('change', updateProvincias);
            provinciaSelect.addEventListener('change', updateDistritos);
        });

        
    </script>
</body>
</html>
